<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>K式漢字ドリル</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        body { font-family: sans-serif; text-align: center; background: #f5f5f5; margin: 0; padding: 0; }
        .selector-bar { background: #222; padding: 10px; display: flex; justify-content: center; }
        .text-select { font-size: 16px; font-weight: bold; padding: 8px 12px; border-radius: 6px; border: 2px solid #ff9800; background: #333; color: white; width: 90%; max-width: 400px; cursor: pointer; }
        
        .tab-bar { display: flex; overflow-x: auto; background: #333; color: white; }
        .tab-bar button { flex: 1 0 auto; padding: 14px 20px; border: none; background: #444; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-bar button.active { background: #ff9800; }

        .mode-bar { display: flex; background: #e0e0e0; }
        .mode-bar button { flex: 1; padding: 12px; border: none; font-size: 15px; font-weight: bold; background: #ccc; color: #333; cursor: pointer; }
        .mode-bar button.active { background: #2196f3; color: white; }

        .screen { display: none; }
        .screen.active { display: block; }

        #startScreen { margin-top: 60px; }
        #startBtn { font-size: 28px; padding: 18px 50px; background: #ff5722; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }

        #drillScreen { margin-top: 20px; padding: 0 15px; }
        /* displayBoxの高さを固定し、重なりを防止 */
        .displayBox { box-sizing: border-box; width: 100%; max-width: 600px; margin: 15px auto; padding: 20px; height: 160px; background: white; border-radius: 12px; border: 3px solid #333; font-size: 42px; font-weight: bold; display: flex; justify-content: center; align-items: center; position: relative; pointer-events: none; }

        .base-red { color: #ff5252; }
        .black-text { color: #333333; }

        /* ボタン行。他の要素に邪魔されないよう高いz-indexを付与 */
        .buttonRow { max-width: 600px; margin: 40px auto; display: flex; justify-content: space-between; position: relative; z-index: 999; }
        .actionBtn { width: 48%; padding: 20px 0; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; color: white; cursor: pointer; position: relative; pointer-events: auto; }
        #btnK2H { background: #4caf50; }
        #btnH2K { background: #9c27b0; }
        .actionBtn.selected { outline: 5px solid #000; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }

        #editorScreen { padding: 15px; text-align: left; max-width: 800px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        td input { width: 95%; font-size: 18px; padding: 6px; }
        .edit-actions { display: flex; justify-content: center; margin-top: 20px; }
        .action { margin: 8px; padding: 12px 25px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>

<div class="selector-bar">
    <select id="textSelector" class="text-select" onchange="selectText(this.value)">
        <option value="中級へ行こう・ピンク">中級へ行こう・ピンク</option>
        <option value="中級を学ぼう・緑">中級を学ぼう・緑</option>
        <option value="中級を学ぼう・青">中級を学ぼう・青</option>
    </select>
</div>

<div class="tab-bar" id="levelTabBar"></div>

<div class="mode-bar">
    <button id="modeDrill" class="active" onclick="switchMode('drill')">🎯 ドリル</button>
    <button id="modeEdit" onclick="switchMode('edit')">✍️ 入力</button>
</div>

<div id="idMain" class="screen active">
    <div id="startScreen" style="display: block;">
        <button id="startBtn" onclick="startDrill()">スタート</button>
    </div>

    <div id="drillScreen" style="display: none;">
        <!-- pointer-events: none でボックスそのものがクリックを奪わないように設定 -->
        <div id="drillTapArea" style="cursor: pointer;">
            <div class="displayBox" id="boxTop"></div>
            <div class="displayBox" id="boxBottom"></div>
        </div>

        <div class="buttonRow">
            <button id="btnK2H" class="actionBtn">漢字→かな</button>
            <button id="btnH2K" class="actionBtn">かな→漢字</button>
        </div>
    </div>
</div>

<div id="editorScreen" class="screen">
    <h2 id="editorTitle"></h2>
    <table>
        <thead><tr><th>漢字</th><th>よみ</th><th>削除</th></tr></thead>
        <tbody id="vocabTableBody"></tbody>
    </table>
    <div class="edit-actions">
        <button id="addRow" class="action" style="background:#4caf50;" onclick="addRow()">行追加</button>
        <button id="save" class="action" style="background:#2196f3;" onclick="saveData()">保存</button>
    </div>
</div>

let currentText = "中級へ行こう・ピンク";
let currentLevel = 1;
let currentDrillWords = [];
let currentIndex = 0;
let isShowingAnswer = false;
let currentMode = "K2H"; 
let levels = {};

function selectText(val) { currentText = val; updateTabBar(); loadLevelData(); resetScreen(); }
function selectLevel(lvl) { currentLevel = lvl; updateTabBar(); loadLevelData(); resetScreen(); }
function resetScreen() { document.getElementById("startScreen").style.display = "block"; document.getElementById("drillScreen").style.display = "none"; }

function updateTabBar() {
    const bar = document.getElementById("levelTabBar");
    bar.innerHTML = "";
    for (let i = 1; i <= 8; i++) {
        const btn = document.createElement("button");
        btn.innerText = "L" + i;
        if (i === currentLevel) btn.className = "active";
        btn.onclick = () => selectLevel(i);
        bar.appendChild(btn);
    }
}

function switchMode(mode) {
    document.getElementById("modeDrill").classList.toggle("active", mode === "drill");
    document.getElementById("modeEdit").classList.toggle("active", mode === "edit");
    document.getElementById("idMain").classList.toggle("active", mode === "drill");
    document.getElementById("editorScreen").classList.toggle("active", mode === "edit");
    if (mode === "edit") loadEditorTable();
}

function loadLevelData() {
    const key = "DATA_" + currentText + "_L" + currentLevel;
    const local = localStorage.getItem(key);
    levels[currentText] = levels[currentText] || {};
    levels[currentText][currentLevel] = local ? JSON.parse(local) : (embeddedLevels[currentText][currentLevel] || []);
    document.getElementById("editorTitle").innerText = "✍️ " + currentText + " (L" + currentLevel + ")";
}

// ボタンのクリック処理を完全に独立
function setDrillMode(mode) {
    currentMode = mode;
    document.getElementById("btnK2H").classList.toggle("selected", mode === "K2H");
    document.getElementById("btnH2K").classList.toggle("selected", mode === "H2K");
    if (currentDrillWords.length > 0) { isShowingAnswer = false; showQuestion(); }
}

function startDrill() {
    let words = levels[currentText][currentLevel] || [];
    currentDrillWords = words.filter(w => w.kanji || w.yomi);
    if (currentDrillWords.length === 0) return alert("データがありません");
    currentDrillWords.sort(() => Math.random() - 0.5);
    currentIndex = 0; isShowingAnswer = false;
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("drillScreen").style.display = "block";
    setDrillMode(currentMode);
}

function showQuestion() {
    const word = currentDrillWords[currentIndex];
    const top = document.getElementById("boxTop");
    const bottom = document.getElementById("boxBottom");
    if (currentMode === "K2H") {
        top.innerHTML = `<span class="black-text">${word.kanji}</span>`;
        bottom.innerHTML = isShowingAnswer ? formatYomiHTML(word.yomi) : "";
    } else {
        top.innerHTML = formatYomiHTML(word.yomi);
        bottom.innerHTML = isShowingAnswer ? `<span class="black-text">${word.kanji}</span>` : "";
    }
}

function handleTap() {
    if (currentDrillWords.length === 0) return;
    if (!isShowingAnswer) { isShowingAnswer = true; showQuestion(); }
    else {
        currentIndex++;
        if (currentIndex >= currentDrillWords.length) {
            alert("終了！"); resetScreen(); return;
        }
        isShowingAnswer = false; showQuestion();
    }
}

function formatYomiHTML(s) {
    return s.replace(/[（(](.*?)[）)]/g, '<span class="base-red">$1</span>').replace(/([^<>]+)(?![^<]*>)/g, '<span class="black-text">$1</span>');
}

// エディタ
function loadEditorTable() {
    const tbody = document.getElementById("vocabTableBody");
    tbody.innerHTML = "";
    const words = levels[currentText][currentLevel] || [];
    words.forEach(w => addRow(w.kanji, w.yomi));
    if (words.length === 0) for(let i=0; i<5; i++) addRow();
}
function addRow(k="", y="") {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="text" value="${k}"></td><td><input type="text" value="${y}"></td><td><button onclick="this.parentNode.parentNode.remove()">X</button></td>`;
    document.getElementById("vocabTableBody").appendChild(tr);
}
function saveData() {
    const rows = document.querySelectorAll("#vocabTableBody tr");
    const data = Array.from(rows).map(r => ({ kanji: r.querySelectorAll("input")[0].value, yomi: r.querySelectorAll("input")[1].value }));
    localStorage.setItem("DATA_" + currentText + "_L" + currentLevel, JSON.stringify(data));
    levels[currentText][currentLevel] = data;
    alert("保存しました");
}

window.onload = function() {
    loadLevelData(); updateTabBar();
    // イベントリスナーの直接登録
    document.getElementById("btnK2H").addEventListener("click", (e) => { e.stopPropagation(); setDrillMode("K2H"); });
    document.getElementById("btnH2K").addEventListener("click", (e) => { e.stopPropagation(); setDrillMode("H2K"); });
    document.getElementById("drillTapArea").addEventListener("click", handleTap);
};
</script>
