        .screen { display: none; }
        .screen.active { display: block; }

        #startScreen { margin-top: 60px; }
        #startBtn { font-size: 28px; padding: 18px 50px; background: #ff5722; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #startBtn:active { transform: scale(0.98); }

        #drillScreen { margin-top: 20px; padding: 0 15px; cursor: pointer; }

        .black-text { color: #333333; }

        .buttonRow { max-width: 600px; margin: 30px auto 0; display: flex; justify-content: space-between; }
        .actionBtn { width: 48%; padding: 20px 0; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; position: relative; }
        #btnK2H { background: #4caf50; }
        #btnH2K { background: #9c27b0; }
        .actionBtn.selected { outline: 4px solid #333; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        #editorScreen { padding: 15px; text-align: left; max-width: 800px; margin: 0 auto; }
        #editorScreen h2 { text-align: center; margin: 15px 0; color: #333; }

        td input:focus { border-color: #2196f3; outline: none; }

        .action { margin: 8px; padding: 12px 25px; font-size: 16px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        </div>
    </div>
</div>

// 状態管理変数
let currentText = "中級へ行こう・ピンク";
let currentLevel = 1;
let currentDrillWords = [];
let currentIndex = 0;
let isShowingAnswer = false;
let currentMode = "K2H"; // 初期値: 漢字→かな
let levels = {};

// 1. テキスト選択の切り替え
function selectText(textName) {
    currentText = textName;
    const availableLvls = Object.keys(embeddedLevels[currentText] || {});
    currentLevel = availableLvls.length > 0 ? Math.min(...availableLvls.map(Number)) : 1;
    
    updateTabBar();
    loadLevelData();
    
    // 画面をリセット
    document.getElementById("startScreen").style.display = "block";
    document.getElementById("drillScreen").style.display = "none";
}

// 2. タブバー（L1〜L8）の更新
function updateTabBar() {
    const tabBar = document.getElementById("levelTabBar");
    if (!tabBar) return;
    tabBar.innerHTML = "";
    
    for (let i = 1; i <= 8; i++) {
        const btn = document.createElement("button");
        btn.innerText = "L" + i;
        if (i === currentLevel) {
            btn.className = "active";
        }
        btn.onclick = () => selectLevel(i);
        tabBar.appendChild(btn);
    }
}

// レベル選択
function selectLevel(lvl) {
    currentLevel = lvl;
    const buttons = document.querySelectorAll("#levelTabBar button");
    buttons.forEach((btn, idx) => {
        if (idx + 1 === lvl) {
            btn.classList.add("active");
        } else {
            btn.classList.remove("active");
        }
    });
    loadLevelData();

    document.getElementById("startScreen").style.display = "block";
    document.getElementById("drillScreen").style.display = "none";
}

// 3. モード切り替え（ドリル vs 入力）
function switchMode(mode) {
    const modeDrill = document.getElementById("modeDrill");
    const modeEdit = document.getElementById("modeEdit");
    const idMain = document.getElementById("idMain");
    const editorScreen = document.getElementById("editorScreen");

    if (mode === "drill") {
        if (modeDrill) modeDrill.classList.add("active");
        if (modeEdit) modeEdit.classList.remove("active");
        if (idMain) idMain.classList.add("active");
        if (editorScreen) editorScreen.classList.remove("active");
        
        document.getElementById("startScreen").style.display = "block";
        document.getElementById("drillScreen").style.display = "none";
    } else {
        if (modeDrill) modeDrill.classList.remove("active");
        if (modeEdit) modeEdit.classList.add("active");
        if (idMain) idMain.classList.remove("active");
        if (editorScreen) editorScreen.classList.add("active");
        
        loadEditorTable();
    }
}

// 4. データ読み込み
function loadLevelData() {
    const key = "DATA_" + currentText + "_L" + currentLevel;
    const localData = localStorage.getItem(key);
    
    if (localData) {
        levels[currentText][currentLevel] = JSON.parse(localData);
    } else {
        levels[currentText][currentLevel] = embeddedLevels[currentText][currentLevel] || [];
    }
    
    const editorTitle = document.getElementById("editorTitle");
    if (editorTitle) {
        editorTitle.innerText = "✍️ " + currentText + " (L" + currentLevel + ") 入力";
    }
}

// 5. ドリルロジック（競合バグを徹底ガード）
function clickAction(mode, event) {
    // ボタンのタップが親の「全画面タップ」に連鎖するのを完全にガード！
    if (event && event.stopPropagation) {
        event.stopPropagation();
    }
    
    currentMode = mode;
    
    document.getElementById("btnK2H").classList.remove("selected");
    document.getElementById("btnH2K").classList.remove("selected");
    
    if (mode === "K2H") {
        document.getElementById("btnK2H").classList.add("selected");
    } else {
        document.getElementById("btnH2K").classList.add("selected");
    }
    
    // モード切り替え時は、現在の単語の問題表示（答えは隠す）に戻して再描画
    if (currentDrillWords.length > 0) {
        isShowingAnswer = false; 
        showQuestion();
    }
}

function startDrill() {
    let words = levels[currentText][currentLevel] || [];
    currentDrillWords = words.filter(w => w.kanji.trim() !== "" || w.yomi.trim() !== "");
    
    if (currentDrillWords.length === 0) {
        alert("このレベルには単語が登録されていません。");
        return;
    }
    
    currentDrillWords.sort(() => Math.random() - 0.5);
    currentIndex = 0;
    isShowingAnswer = false;
    
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("drillScreen").style.display = "block";
    
    // 初期選択のボタン表示をリフレッシュ
    clickAction(currentMode, null);
}

function showQuestion() {
    const word = currentDrillWords[currentIndex];
    const boxTop = document.getElementById("boxTop");
    const boxBottom = document.getElementById("boxBottom");
    
    if (currentMode === "K2H") {
        boxTop.innerHTML = `<span class="black-text">${word.kanji}</span>`;
        if (isShowingAnswer) {
            boxBottom.innerHTML = formatYomiHTML(word.yomi);
        } else {
            boxBottom.innerHTML = "";
        }
    } else {
        boxTop.innerHTML = formatYomiHTML(word.yomi);
        if (isShowingAnswer) {
            boxBottom.innerHTML = `<span class="black-text">${word.kanji}</span>`;
        } else {
            boxBottom.innerHTML = "";
        }
    }
}

function handleScreenTap() {
    if (currentDrillWords.length === 0) return;
    
    if (!isShowingAnswer) {
        isShowingAnswer = true;
        showQuestion();
    } else {
        currentIndex++;
        if (currentIndex >= currentDrillWords.length) {
            alert("すべての問題が終わりました！スタートに戻ります。");
            document.getElementById("startScreen").style.display = "block";
            document.getElementById("drillScreen").style.display = "none";
            currentDrillWords = [];
            return;
        }
        isShowingAnswer = false;
        showQuestion();
    }
}

function formatYomiHTML(yomiStr) {
    if (!yomiStr) return "";
    let html = "";
    let inParentheses = false;
    
    for (let i = 0; i < yomiStr.length; i++) {
        const char = yomiStr[i];
        if (char === "（" || char === "(") {
            inParentheses = true;
            html += `<span class="base-red">`;
        } else if (char === "）" || char === ")") {
            inParentheses = false;
            html += `</span>`;
        } else {
            if (!inParentheses) {
                html += `<span class="black-text">${char}</span>`;
            } else {
                html += char;
            }
        }
    }
    return html;
}

// 6. エディタロジック
function loadEditorTable() {
    const tbody = document.querySelector("#vocabTable tbody");
    if (!tbody) return;
    tbody.innerHTML = "";
    
    const words = levels[currentText][currentLevel] || [];
    words.forEach((word) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input type="text" value="${word.kanji}"></td>
            <td><input type="text" value="${word.yomi}"></td>
            <td><button onclick="this.parentNode.parentNode.remove()">X</button></td>
        `;
        tbody.appendChild(tr);
    });
    
    if (words.length === 0) {
        for (let i = 0; i < 5; i++) addRow();
    }
}

function addRow() {
    const tbody = document.querySelector("#vocabTable tbody");
    if (!tbody) return;
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><input type="text" value=""></td>
        <td><input type="text" value=""></td>
        <td><button onclick="this.parentNode.parentNode.remove()">X</button></td>
    `;
    tbody.appendChild(tr);
}

function saveData() {
    const rows = document.querySelectorAll("#vocabTable tbody tr");
    const newData = [];
    
    rows.forEach((row) => {
        const inputs = row.querySelectorAll("input");
        if (inputs.length >= 2) {
            const kanjiVal = inputs[0].value.trim();
            const yomiVal = inputs[1].value.trim();
            if (kanjiVal || yomiVal) {
                newData.push({ kanji: kanjiVal, yomi: yomiVal });
            }
        }
    });
    
    levels[currentText][currentLevel] = newData;
    
    const key = "DATA_" + currentText + "_L" + currentLevel;
    localStorage.setItem(key, JSON.stringify(newData));
    alert(currentText + " (L" + currentLevel + ") のデータを保存しました。");
}

function clearAll() {
    if (confirm("このレベルの入力をすべてクリアしますか？")) {
        const tbody = document.querySelector("#vocabTable tbody");
        if (tbody) tbody.innerHTML = "";
        for (let i = 0; i < 5; i++) addRow();
    }
}

// 7. アプリ初期化
window.onload = function() {
    for (let textName in embeddedLevels) {
        levels[textName] = {};
        for (let lvlStr in embeddedLevels[textName]) {
            const lvl = parseInt(lvlStr);
            const key = "DATA_" + textName + "_L" + lvl;
            const localData = localStorage.getItem(key);
            if (localData) {
                levels[textName][lvl] = JSON.parse(localData);
            } else {
                levels[textName][lvl] = embeddedLevels[textName][lvl];
            }
        }
    }

    // ドリル画面全体のタップ進行を設定
    document.getElementById("drillScreen").addEventListener("click", function(e) {
        handleScreenTap();
    });

    // 初期状態指定：中級へ行こう・ピンク L1 ドリル
    const textSelector = document.getElementById("textSelector");
    if (textSelector) textSelector.value = currentText;

    updateTabBar();
    loadLevelData();
    switchMode("drill");
};
</script>
